async function addFiles(fileList) {
  for (const file of fileList) {
    if (file.type.startsWith("image/")) {
      if (!vision()) { toast(ready() ? "This model can't see pictures" : "Connect first to send pictures"); continue; }
      if (draftFiles.filter((f) => f.kind === "image").length >= MAX_IMAGES) { toast(`Up to ${MAX_IMAGES} pictures per message`); break; }
      try { draftFiles.push({ kind: "image", name: file.name, ...(await shrinkImage(file)) }); } catch { toast(`Couldn't read ${file.name}`); }
    } else {
      if (file.size > MAX_TEXT_FILE) { toast(`${file.name} is too big (over 400 KB of text)`); continue; }
      const text = await file.text();
      if (/\u0000/.test(text.slice(0, 4096))) { toast(`${file.name} isn't a text file`); continue; }
      draftFiles.push({ kind: "text", name: file.name, text });
    }
  }
  renderComposer();
}

/** Pictures go to the model as JPEG no bigger than 1280 px: plenty for it, small for the browser's storage. */
async function shrinkImage(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
  const canvas = el("canvas", { width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale) });
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const url = canvas.toDataURL("image/jpeg", 0.86);
  return { url, data: url.slice(url.indexOf(",") + 1) };
}

    const yesBtn = $("confirm-yes"), noBtn = $("confirm-no");

    const cleanup = () => { yesBtn.removeEventListener("click", onYes); noBtn.removeEventListener("click", onNo); dialog.removeEventListener("cancel", onCancel); };
    yesBtn.addEventListener("click", onYes);
    noBtn.addEventListener("click", onNo);
    dialog.addEventListener("cancel", onCancel);

    if (files.length && !e.clipboardData.getData("text/plain")) { e.preventDefault(); addFiles(files); }
  });
  $("composer").addEventListener("submit", (e) => { e.preventDefault(); if (!running) send(); });
  $("send").addEventListener("click", (e) => { if (running) { e.preventDefault(); if (running.chat.id === currentId) stop(); } });
  $("attach").addEventListener("click", () => {
    $("file-input").accept = vision() ? "image/*,text/*,.md,.py,.js,.ts,.json,.csv,.log,.yaml,.yml,.toml,.sh,.ps1,.c,.cpp,.h,.java,.go,.rs,.rb,.php,.sql,.html,.css,.xml" : "text/*,.md,.py,.js,.ts,.json,.csv,.log,.yaml,.yml,.toml,.sh,.ps1,.c,.cpp,.h,.java,.go,.rs,.rb,.php,.sql,.html,.css,.xml";
    $("file-input").click();
  });
  $("file-input").addEventListener("change", (e) => { addFiles([...e.target.files]); e.target.value = ""; });
  const composer = $("composer");
  // Files are attached; dragged text falls through to the browser, which types it in.
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
  composer.addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); composer.classList.add("dragging"); });
  composer.addEventListener("dragleave", () => composer.classList.remove("dragging"));
  composer.addEventListener("drop", (e) => { composer.classList.remove("dragging"); if (!hasFiles(e)) return; e.preventDefault(); addFiles([...e.dataTransfer.files]); });

  $("think").addEventListener("click", (e) => { e.stopPropagation(); renderEffortMenu(); $("effort-menu").hidden = !$("effort-menu").hidden; });
  $("more").addEventListener("click", (e) => { e.stopPropagation(); $("more-menu").hidden = !$("more-menu").hidden; });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#effort-menu")) $("effort-menu").hidden = true;
    if (!e.target.closest("#more-menu")) $("more-menu").hidden = true;
  });

  $("menu-export").addEventListener("click", () => {
    const chat = currentChat();
    if (!chat) return;
    const text = `# ${chat.title}\n\n` + chat.messages.map((m) => {
      const { content } = m.role === "assistant" ? splitThinking(m) : { content: messageText(m) };
      return `**${m.role === "user" ? "You" : modelName()}:**\n\n${content}`;
    }).join("\n\n---\n\n") + "\n";
    saveFile(`${chat.title.replace(/[\\/:*?"<>|]+/g, "").slice(0, 60) || "chat"}.md`, text, "text/markdown");
  });
  $("menu-delete").addEventListener("click", () => currentId && deleteChat(currentId));
  $("menu-connect").addEventListener("click", () => openConnectDialog());
  $("menu-shutdown").addEventListener("click", async () => {
    if (!(await confirmDialog("Shut the server down?", "The notebook stops and the GPU is freed, so it stops counting against your weekly hours. To chat again, run the notebook again.", "Shut down"))) return;
    try {
      const res = await call("/shutdown", { method: "POST" });
      if (!res.ok) throw new Error(await res.text());
      running?.controller.abort();
      server.state = "stopped";
      clearTimeout(server.timer);
      renderAll();
      toast("Shutting down");
    } catch { toast("Couldn't reach the server"); }
  });

  $("settings-connect").addEventListener("click", () => { $("settings").close(); openConnectDialog(); });
  $("settings-forget").addEventListener("click", async () => {
    if (await confirmDialog("Forget this server?", "Its address and key are removed from this browser. Your chats stay.", "Forget")) { forgetServer(); $("settings").close(); }
  });
  $("pref-system").addEventListener("change", (e) => { prefs.system = e.target.value; savePrefs(); });
  $("pref-temperature").addEventListener("change", (e) => { prefs.temperature = e.target.value.trim(); savePrefs(); });
  for (const [id, key] of [["pref-size", "size"], ["pref-send", "send"]]) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      prefs[key] = b.dataset.value;
      savePrefs();
      applyTheme();
      openSettings();
      renderComposer();
    });
  }
  $("export-all").addEventListener("click", () => saveFile(`chats-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "no-gpu-local-ai", version: 1, chats }, null, 1), "application/json"));
  $("import-all").addEventListener("click", () => $("import-input").click());
  $("import-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const incoming = (Array.isArray(data.chats) ? data.chats : []).map(normaliseChat).filter(Boolean);
      for (const chat of incoming) {
        const existing = chats.findIndex((c) => c.id === chat.id);
        if (existing >= 0) chats[existing] = chat; else chats.push(chat);
        await chatStore.put(chat);
      }
      renderAll();
      toast(`Imported ${plural(incoming.length, "chat")}`);
    } catch { toast("That file isn't a chat export"); }
  });
  $("delete-all").addEventListener("click", async () => {
    if (!(await confirmDialog("Delete all chats?", "Every chat in this browser is removed for good.", "Delete all"))) return;
    running?.controller.abort();
    chats = [];
    currentId = null;
    await chatStore.clear();
    renderAll();
  });

  document.addEventListener("keydown", (e) => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); }
    else if (ctrl && e.key.toLowerCase() === "k") { e.preventDefault(); if (isPhone()) setSidebar(true); $("search").focus(); }
    else if (e.key === "Escape" && !e.isComposing && !e.defaultPrevented && !document.querySelector("dialog[open]")) {
      const menus = [$("effort-menu"), $("more-menu")].filter((m) => !m.hidden);
      if (menus.length) menus.forEach((m) => { m.hidden = true; });
      else if (running && running.chat.id === currentId && document.activeElement?.id !== "search") stop();
    }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && server.url && Date.now() - server.checkedAt > 20_000) checkServer({ quiet: true }); });
  window.addEventListener("hashchange", () => {
    const fromLink = parseLink(location.hash);
    if (fromLink) { history.replaceState(null, "", location.pathname + location.search); connect(fromLink.url, fromLink.key); }
  });
  setInterval(() => { if (ready()) { renderMeters(); if (!currentChat()?.messages.length) renderThread(); } }, 30_000);
}

async function main() {
  applyTheme();
  wire();
  if (!isPhone()) setSidebar(prefs.sidebar !== false);
  else $("show-sidebar").hidden = false;
  loadConnection();
  const cached = store.get("info", null);
  if (server.url && cached) server.info = { ...cached, ends_in_s: null };
  await chatStore.open();
  try { chats = (await chatStore.all()).sort((a, b) => b.updated - a.updated); } catch { chats = []; }
  renderAll();
  if (server.url) checkServer();
  $("input").focus();
}

main();
</script>
</body>
</html>
