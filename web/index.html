<style>
/* Instrument: graphite surfaces, hairline rules, one violet accent and a mint for live readings.
   Interface text in Inter; numbers, code and readouts in JetBrains Mono. Dark by default. */

:root {
  --bg: #f6f7f9;
  --bg-sidebar: #eef0f4;
  --panel: #ffffff;
  --fill: #eceef3;
  --fill-2: #e1e4eb;
  --hover: rgb(20 24 40 / 0.05);
  --press: rgb(20 24 40 / 0.09);
  --separator: rgb(20 24 40 / 0.09);
  --separator-strong: rgb(20 24 40 / 0.16);
  --label: #14161c;
  --label-2: #4b5060;
  --label-3: #878c9b;
  --prose: #1d2028;
  --accent: #5b4ee0;
  --accent-hover: #4b3fd0;
  --on-accent: #ffffff;
  --accent-fill: rgb(91 78 224 / 0.1);
  --accent-line: rgb(91 78 224 / 0.35);
  --accent-ink: #4535c2;
  --material: rgb(246 247 249 / 0.84);
  --code-bg: #fbfbfd;
  --code-head: #f2f3f7;
  --code-gutter: #b7bbc7;
  --ok: #0f8f5c;
  --ok-fill: rgb(15 143 92 / 0.1);
  --warn: #a35f00;
  --warn-fill: #fbf0dc;
  --err: #c42645;
  --err-fill: #fbe8ec;
  --tok-keyword: #7a3ccf;
  --tok-string: #0b7a52;
  --tok-number: #b35c00;
  --tok-comment: #8a8f9c;
  --tok-fn: #2f5bd0;
  --tok-tag: #c42645;
  --shadow-2: 0 6px 18px rgb(20 24 40 / 0.08), 0 1px 3px rgb(20 24 40 / 0.06);
  --shadow-3: 0 22px 48px -18px rgb(20 24 40 / 0.28), 0 4px 12px rgb(20 24 40 / 0.06);
  --glow: 0 0 0 4px rgb(91 78 224 / 0.07);
  --scrim: rgb(10 12 20 / 0.32);

  --ui: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --sidebar-w: 272px;
  --measure: 760px;
  --topbar-h: 52px;
  --r-sm: 7px;
  --r: 10px;
  --r-lg: 14px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --text: 15.5px;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0b0c0f;
  --bg-sidebar: #0f1116;
  --panel: #101217;
  --fill: #171a22;
  --fill-2: #1f232e;
  --hover: rgb(232 234 240 / 0.05);
  --press: rgb(232 234 240 / 0.09);
  --separator: rgb(232 234 240 / 0.08);
  --separator-strong: rgb(232 234 240 / 0.15);
  --label: #e8e9ee;
  --label-2: #a3a7b5;
  --label-3: #6b7080;
  --prose: #dcdde4;
  --accent: #9384ff;
  --accent-hover: #a698ff;
  --on-accent: #12102a;
  --accent-fill: rgb(147 132 255 / 0.13);
  --accent-line: rgb(147 132 255 / 0.38);
  --accent-ink: #b9afff;
  --material: rgb(11 12 15 / 0.84);
  --code-bg: #0d0f14;
  --code-head: #11141b;
  --code-gutter: #3a3f4e;
  --ok: #3fd99a;
  --ok-fill: rgb(63 217 154 / 0.12);
  --warn: #f2b45c;
  --warn-fill: rgb(242 180 92 / 0.13);
  --err: #ff7a8a;
  --err-fill: rgb(255 122 138 / 0.13);
  --tok-keyword: #c3a6ff;
  --tok-string: #8ee0b5;
  --tok-number: #f2b45c;
  --tok-comment: #5d6374;
  --tok-fn: #8fb3ff;
  --tok-tag: #ff9aa8;
  --shadow-2: 0 8px 22px rgb(0 0 0 / 0.45), 0 1px 3px rgb(0 0 0 / 0.35);
  --shadow-3: 0 24px 60px -20px rgb(0 0 0 / 0.75), 0 4px 14px rgb(0 0 0 / 0.4);
  --glow: 0 0 0 4px rgb(147 132 255 / 0.06);
  --scrim: rgb(0 0 0 / 0.55);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0b0c0f;
    --bg-sidebar: #0f1116;
    --panel: #101217;
    --fill: #171a22;
    --fill-2: #1f232e;
    --hover: rgb(232 234 240 / 0.05);
    --press: rgb(232 234 240 / 0.09);
    --separator: rgb(232 234 240 / 0.08);
    --separator-strong: rgb(232 234 240 / 0.15);
    --label: #e8e9ee;
    --label-2: #a3a7b5;
    --label-3: #6b7080;
    --prose: #dcdde4;
    --accent: #9384ff;
    --accent-hover: #a698ff;
    --on-accent: #12102a;
    --accent-fill: rgb(147 132 255 / 0.13);
    --accent-line: rgb(147 132 255 / 0.38);
    --accent-ink: #b9afff;
    --material: rgb(11 12 15 / 0.84);
    --code-bg: #0d0f14;
    --code-head: #11141b;
    --code-gutter: #3a3f4e;
    --ok: #3fd99a;
    --ok-fill: rgb(63 217 154 / 0.12);
    --warn: #f2b45c;
    --warn-fill: rgb(242 180 92 / 0.13);
    --err: #ff7a8a;
    --err-fill: rgb(255 122 138 / 0.13);
    --tok-keyword: #c3a6ff;
    --tok-string: #8ee0b5;
    --tok-number: #f2b45c;
    --tok-comment: #5d6374;
    --tok-fn: #8fb3ff;
    --tok-tag: #ff9aa8;
    --shadow-2: 0 8px 22px rgb(0 0 0 / 0.45), 0 1px 3px rgb(0 0 0 / 0.35);
    --shadow-3: 0 24px 60px -20px rgb(0 0 0 / 0.75), 0 4px 14px rgb(0 0 0 / 0.4);
    --glow: 0 0 0 4px rgb(147 132 255 / 0.06);
    --scrim: rgb(0 0 0 / 0.55);
    color-scheme: dark;
  }
}

:root[data-size="small"] { --text: 14.5px; }
:root[data-size="large"] { --text: 17px; }

/* ------------------------------------------------------------------ base */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--label);
  font: 14px/1.5 var(--ui);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: 0.45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }
::selection { background: var(--accent-fill); }
.scroll { scrollbar-width: thin; scrollbar-color: var(--fill-2) transparent; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--separator-strong); border-radius: var(--r-sm);
  background: var(--panel); color: var(--label);
  font-weight: 560; font-size: 13px; white-space: nowrap;
  transition: background 120ms, border-color 120ms, transform 120ms;
}
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--label-3); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--err); }
.btn-ghost { border-color: transparent; background: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px;
  border-radius: var(--r-sm); color: var(--label-2);
  transition: background 120ms, color 120ms;
}
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--label); }
kbd {
  font: 500 10.5px var(--mono); color: var(--label-3);
  border: 1px solid var(--separator-strong); border-radius: 4px; padding: 1px 5px;
}
.field { display: grid; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 560; color: var(--label-2); }
.field small { color: var(--label-3); font-size: 12px; }
.input {
  width: 100%; height: 36px; padding: 0 11px;
  border: 1px solid var(--separator-strong); border-radius: var(--r-sm);
  background: var(--bg); color: var(--label); outline: none;
}
textarea.input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent); box-shadow: var(--glow); }
.segmented { display: inline-flex; border: 1px solid var(--separator-strong); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
.segmented button { padding: 4px 11px; border-radius: 5px; font-size: 12.5px; font-weight: 560; color: var(--label-2); }
.segmented button[aria-pressed="true"] { background: var(--fill-2); color: var(--label); }

/* ------------------------------------------------------------------ layout */

.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.app.sidebar-hidden { grid-template-columns: 0 minmax(0, 1fr); }
.app.sidebar-hidden .sidebar { visibility: hidden; }
.main { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100vh; height: 100dvh; }

/* ------------------------------------------------------------------ sidebar */

.sidebar { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg-sidebar); border-right: 1px solid var(--separator); }
.sidebar-head { display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 10px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
.brand-mark { width: 24px; height: 24px; flex: none; }
.brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-badge {
  flex: none; font: 500 10.5px var(--mono); color: var(--label-2);
  border: 1px solid var(--separator-strong); border-radius: 4px; padding: 1px 5px; letter-spacing: 0.02em;
}
.side-actions { display: grid; gap: 6px; padding: 6px 10px 10px; }
.side-new {
  display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
  border-radius: var(--r-sm); font-weight: 560; color: var(--label);
}
.side-new:hover { background: var(--hover); }
.side-new kbd { margin-left: auto; }
.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--label-3); }
.search input { padding-left: 33px; background: var(--fill); border-color: transparent; }
.chat-list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.chat-group { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label-3); padding: 14px 8px 6px; }
.chat-item {
  position: relative; display: flex; align-items: center; gap: 9px; width: 100%;
  height: 34px; padding: 0 8px; border-radius: var(--r-sm); text-align: left; color: var(--label-2);
}
.chat-item:hover { background: var(--hover); color: var(--label); }
.chat-item[aria-current="true"] { background: var(--fill-2); color: var(--label); }
.chat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label-3); opacity: 0.5; flex: none; }
.chat-item[aria-current="true"] .chat-dot { background: var(--accent); opacity: 1; }
.chat-item.live .chat-dot { background: var(--ok); opacity: 1; animation: breathe 1.4s ease-in-out infinite; }
.chat-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.chat-time { font: 11px var(--mono); color: var(--label-3); }
.chat-del { display: none; color: var(--label-3); width: 24px; height: 24px; place-items: center; border-radius: 5px; }
.chat-del:hover { color: var(--err); background: var(--hover); }
.chat-item:hover .chat-time, .chat-item:focus-within .chat-time { display: none; }
.chat-item:hover .chat-del, .chat-item:focus-within .chat-del { display: grid; }
@media (hover: none) { .chat-time { display: none; } .chat-del { display: grid; } }
.list-empty { padding: 14px 8px; color: var(--label-3); font-size: 13px; line-height: 1.55; }

.meters { display: grid; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--separator); }
.meter-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--label-2); }
.meter-value { font: 500 11.5px var(--mono); color: var(--label); }
.meter-track { height: 3px; margin-top: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 600ms var(--ease); }
.meter-fill.low { background: var(--warn); }
.meter-note { margin-top: 5px; font-size: 11.5px; color: var(--label-3); }

.sidebar-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border-top: 1px solid var(--separator); }

/* ------------------------------------------------------------------ topbar: the instrument strip */

.topbar {
  position: relative; z-index: 3; display: flex; align-items: stretch; flex: none;
  height: var(--topbar-h); border-bottom: 1px solid var(--separator);
  background: var(--material); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.chat-heading { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 6px; }
.chat-heading strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 620; font-size: 14px; }
.chat-count { flex: none; font: 11.5px var(--mono); color: var(--label-3); }
.cells { display: flex; align-items: stretch; }
.cell { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-left: 1px solid var(--separator); white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-3); flex: none; }
.status[data-tone="ok"] .status-dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-fill); }
.status[data-tone="warn"] .status-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-fill); }
.status[data-tone="err"] .status-dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-fill); }
.status[data-tone="busy"] .status-dot { background: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
.status-text { font-weight: 600; font-size: 13px; }
.status-detail { font: 11.5px var(--mono); color: var(--label-2); }
.gauge-name { font-size: 12px; color: var(--label-2); }
.gauge-track { width: 72px; height: 3px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.gauge-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 500ms var(--ease); }
.gauge-fill.high { background: var(--warn); }
.gauge-value { font: 500 12px var(--mono); color: var(--label); min-width: 56px; }
.spark { width: 64px; height: 18px; }
.spark path { fill: none; stroke: var(--ok); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.topbar-end { display: flex; align-items: center; padding: 0 8px; border-left: 1px solid var(--separator); }
.menu { position: absolute; right: 8px; top: calc(var(--topbar-h) - 4px); z-index: 20; min-width: 220px; padding: 5px; border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow-3); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 6px; font-weight: 500; text-align: left; }
.menu button:hover:not(:disabled) { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--separator); margin: 5px 4px; }

@media (max-width: 1180px) { .cell-speed { display: none; } }
@media (max-width: 980px) { .cell-memory { display: none; } }

/* ------------------------------------------------------------------ conversation */

.scroller { flex: 1; overflow-y: auto; overflow-x: hidden; }
.thread { max-width: var(--measure); margin: 0 auto; padding: 32px 24px 40px; }

.msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; margin-bottom: 30px; }
.avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--separator-strong); color: var(--label-2); }
.msg.assistant .avatar { color: var(--accent-ink); border-color: var(--accent-line); background: var(--accent-fill); }
.msg-main { min-width: 0; padding-top: 3px; }
.msg.user .msg-text { font-size: var(--text); font-weight: 500; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-files { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.file-chip {
  display: inline-flex; align-items: center; gap: 7px; max-width: 260px; height: 30px; padding: 0 10px;
  border: 1px solid var(--separator-strong); border-radius: var(--r-sm); background: var(--panel); font-size: 12.5px; color: var(--label-2);
}
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip button { color: var(--label-3); display: grid; place-items: center; }
.file-chip button:hover { color: var(--err); }
.thumb { width: 88px; height: 88px; border-radius: var(--r-sm); object-fit: cover; border: 1px solid var(--separator-strong); background: var(--fill); }
.msg-actions { display: flex; align-items: center; gap: 2px; margin-top: 6px; }
.msg-actions .icon-btn { width: 28px; height: 28px; color: var(--label-3); }
.msg-actions .icon-btn:hover { color: var(--label); }
.msg.user .msg-actions { opacity: 0; transition: opacity 120ms; }
.msg.user:hover .msg-actions, .msg.user:focus-within .msg-actions { opacity: 1; }
@media (hover: none) { .msg.user .msg-actions { opacity: 1; } }
.readings { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font: 11.5px var(--mono); color: var(--label-3); }
.readings .speed { color: var(--ok); display: inline-flex; align-items: center; gap: 6px; }
.readings .speed::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.readings .stopped { color: var(--warn); }
.msg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; }
.msg-foot .msg-actions { margin-top: 0; }
.msg-error { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--err-fill); color: var(--err); font-size: 13.5px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.editor { display: grid; gap: 8px; }
.editor-bar { display: flex; gap: 8px; justify-content: flex-end; }
.cursor::after { content: ""; display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: -0.15em; background: var(--accent); animation: blink 1s steps(2) infinite; }

/* the reasoning trace */
.trace { margin-bottom: 14px; border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.trace > summary { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; cursor: pointer; list-style: none; user-select: none; }
.trace > summary::-webkit-details-marker { display: none; }
.trace-icon { color: var(--accent); }
.trace-title { font-weight: 600; font-size: 13px; }
.trace-meta { margin-left: auto; font: 11px var(--mono); color: var(--label-3); }
.trace-chevron { color: var(--label-3); transition: rotate 160ms var(--ease); }
.trace[open] .trace-chevron { rotate: 90deg; }
.trace-body { border-top: 1px solid var(--separator); padding: 12px 16px 14px 36px; max-height: 420px; overflow-y: auto; color: var(--label-2); font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.trace.live .trace-title::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 8px; border-radius: 50%; background: var(--accent); vertical-align: middle; animation: breathe 1s ease-in-out infinite; }

/* the model's replies */
.prose { color: var(--prose); font-size: var(--text); line-height: 1.72; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 0.9em; }
.prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { color: var(--label); line-height: 1.3; margin: 1.5em 0 0.6em; letter-spacing: -0.01em; }
.prose h1 { font-size: 1.45em; } .prose h2 { font-size: 1.28em; } .prose h3 { font-size: 1.12em; } .prose h4, .prose h5, .prose h6 { font-size: 1em; }
.prose ul, .prose ol { margin: 0 0 0.9em; padding-left: 1.5em; }
.prose li { margin: 0.25em 0; }
.prose li > p { margin: 0.25em 0; }
.prose li::marker { color: var(--label-3); }
.prose blockquote { margin: 0 0 0.9em; padding: 2px 0 2px 14px; border-left: 2px solid var(--accent-line); color: var(--label-2); }
.prose hr { border: 0; border-top: 1px solid var(--separator-strong); margin: 1.6em 0; }
.prose a { color: var(--accent-ink); text-decoration: underline; text-decoration-color: var(--accent-line); text-underline-offset: 2px; }
.prose code { font-family: var(--mono); font-size: 0.86em; padding: 0.12em 0.38em; border-radius: 5px; background: var(--fill); border: 1px solid var(--separator); }
.prose strong { color: var(--label); font-weight: 650; }
.table-wrap { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--separator-strong); border-radius: var(--r-sm); }
.prose table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
.prose th, .prose td { padding: 7px 12px; border-bottom: 1px solid var(--separator); text-align: left; vertical-align: top; }
.prose th { background: var(--code-head); color: var(--label); font-weight: 600; }
.prose tr:last-child td { border-bottom: 0; }

/* code blocks: language, line count, Copy, Download; numbers beside the code */
.code-block { margin: 0 0 1em; border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--code-bg); overflow: hidden; }
.code-head { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 12px; background: var(--code-head); border-bottom: 1px solid var(--separator); }
.code-lang { font: 500 12px var(--mono); color: var(--label); }
.code-count { font: 11.5px var(--mono); color: var(--label-3); }
.code-actions { margin-left: auto; display: flex; gap: 4px; }
.code-action { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--separator-strong); border-radius: 6px; font-size: 12px; font-weight: 560; color: var(--label-2); }
.code-action:hover { color: var(--label); background: var(--hover); }
.code-action svg.i { width: 13px; height: 13px; }
.code-body { display: flex; overflow-x: auto; }
.code-gutter { flex: none; padding: 12px 10px 12px 14px; text-align: right; user-select: none; color: var(--code-gutter); font: 12.5px/1.65 var(--mono); white-space: pre; }
.code-body pre { margin: 0; padding: 12px 16px 12px 6px; flex: 1; }
.code-body code { font: 13px/1.65 var(--mono); color: var(--label); white-space: pre; background: none; border: 0; padding: 0; }
.t-keyword { color: var(--tok-keyword); }
.t-string { color: var(--tok-string); }
.t-number { color: var(--tok-number); }
.t-comment { color: var(--tok-comment); font-style: italic; }
.t-fn { color: var(--tok-fn); }
.t-tag { color: var(--tok-tag); }

/* the start screen */
.start { padding-top: 7vh; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label-2); }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-fill); }
.eyebrow.off::before { background: var(--label-3); box-shadow: none; }
.start h1 { margin: 14px 0 10px; font-size: clamp(34px, 6vw, 52px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; }
.start-lede { margin: 0 0 26px; max-width: 560px; color: var(--label-2); font-size: 16px; line-height: 1.6; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.tile { padding: 13px 14px 14px; border-left: 1px solid var(--separator); min-width: 0; }
.tile:first-child { border-left: 0; }
.tile-name { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label-3); }
.tile-value { margin-top: 6px; font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-note { margin-top: 4px; font-size: 12px; color: var(--label-3); line-height: 1.4; }
@media (max-width: 720px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:nth-child(3) { border-left: 0; }
  .tile:nth-child(n + 3) { border-top: 1px solid var(--separator); }
}

/* connecting */
.connect { max-width: 560px; }
.connect-card { margin-top: 22px; padding: 20px; border: 1px solid var(--separator-strong); border-radius: var(--r-lg); background: var(--panel); display: grid; gap: 14px; box-shadow: var(--shadow-2); }
.connect-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.connect-error { color: var(--err); font-size: 13px; }
.steps { margin: 26px 0 0; padding: 0; list-style: none; display: grid; gap: 0; border: 1px solid var(--separator-strong); border-radius: var(--r); overflow: hidden; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--separator); color: var(--label-2); font-size: 13.5px; line-height: 1.55; }
.steps li:first-child { border-top: 0; }
.steps .n { font: 11px/1.9 var(--mono); color: var(--label-3); }
.steps strong { color: var(--label); font-weight: 600; }
.steps a, .connect a:not(.btn) { color: var(--accent-ink); }
.section-label { margin: 28px 0 10px; font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label-3); }
.connect .connect-card { margin-top: 0; }

/* where to run the server: two choices, then that one's steps */
.host-chooser { margin-top: 22px; display: grid; gap: 14px; }
.host-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.host-tab { display: grid; gap: 4px; padding: 13px 14px; text-align: left; border-radius: var(--r); background: var(--panel); border: 1px solid var(--separator-strong); transition: border-color 120ms, background 120ms, box-shadow 120ms, transform 120ms; }
.host-tab:hover { border-color: var(--label-3); }
.host-tab:active { transform: scale(0.99); }
.host-tab[aria-checked="true"] { border-color: var(--accent); background: var(--accent-fill); box-shadow: 0 0 0 3px var(--accent-fill); }
.host-tab-name { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; color: var(--label); }
.host-tab-badge { font: 500 10px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); border-radius: 999px; padding: 1px 7px; }
.host-tab-meta { font: 11.5px/1.45 var(--mono); color: var(--label-2); }
.host-body { display: grid; gap: 12px; }
.host-steps { margin: 0; }
.host-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.host-actions .btn { text-decoration: none; }
.host-note { flex: 1; min-width: 220px; font-size: 12.5px; line-height: 1.5; color: var(--label-3); }
dialog .host-chooser { margin-top: 0; }
@media (max-width: 520px) { .host-tabs { grid-template-columns: minmax(0, 1fr); } }

/* ------------------------------------------------------------------ dock: banner and composer */

.dock { position: relative; flex: none; padding: 0 24px max(16px, env(safe-area-inset-bottom)); }
.dock::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 28px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
.dock-inner { max-width: var(--measure); margin: 0 auto; }
.banner { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 10px 12px 10px 14px; border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--panel); font-size: 13.5px; box-shadow: var(--shadow-2); }
.banner[data-tone="err"] { border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.banner[data-tone="warn"] { border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner-text { flex: 1; min-width: 0; color: var(--label-2); }
.banner-text strong { color: var(--label); }
.banner-actions { display: flex; gap: 6px; flex: none; }

.composer { position: relative; border: 1px solid var(--separator-strong); border-radius: var(--r-lg); background: var(--panel); box-shadow: var(--shadow-2), var(--glow); transition: border-color 160ms, box-shadow 160ms; }
.composer:focus-within { border-color: var(--accent-line); box-shadow: var(--shadow-2), 0 0 0 4px var(--accent-fill); }
.composer.dragging { border-color: var(--accent); }
.composer-files { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 12px 0; }
.composer-files .thumb { width: 52px; height: 52px; }
.thumb-wrap { position: relative; }
.thumb-wrap button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--fill-2); color: var(--label); display: grid; place-items: center; border: 1px solid var(--separator-strong); }
.composer textarea { display: block; width: 100%; min-height: 52px; max-height: 40vh; padding: 14px 16px 6px; border: 0; outline: none; resize: none; background: none; font-size: var(--text); line-height: 1.55; }
.composer textarea::placeholder { color: var(--label-3); }
.composer-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--separator-strong); border-radius: var(--r-sm); font-size: 12.5px; font-weight: 560; color: var(--label-2); }
.chip:hover:not(:disabled) { background: var(--hover); color: var(--label); }
.chip.on { color: var(--accent-ink); border-color: var(--accent-line); background: var(--accent-fill); }
.chip svg.i { width: 14px; height: 14px; }
.hint { margin-left: auto; font: 11px var(--mono); color: var(--label-3); white-space: nowrap; }
.send { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); transition: background 120ms, transform 120ms; }
.send:hover:not(:disabled) { background: var(--accent-hover); }
.send:active:not(:disabled) { transform: scale(0.94); }
.send:disabled { background: var(--fill-2); color: var(--label-3); opacity: 1; }
.send.stop { background: var(--label); color: var(--bg); }
.effort-menu { position: absolute; bottom: calc(100% + 8px); left: 10px; z-index: 10; width: 290px; padding: 5px; border: 1px solid var(--separator-strong); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow-3); }
.effort-menu button { display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; }
.effort-menu button:hover { background: var(--hover); }
.effort-menu .check { grid-row: span 2; color: var(--accent); align-self: center; visibility: hidden; }
.effort-menu button[aria-checked="true"] .check { visibility: visible; }
.effort-menu b { font-weight: 600; font-size: 13px; }
.effort-menu small { color: var(--label-3); font-size: 12px; }
@media (max-width: 640px) { .hint { display: none; } .send { margin-left: auto; } }

/* ------------------------------------------------------------------ dialogs */

dialog { padding: 0; border: 1px solid var(--separator-strong); border-radius: var(--r-lg); background: var(--panel); color: var(--label); box-shadow: var(--shadow-3); width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(2px); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--separator); }
.dialog-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
.dialog-body { padding: 18px 20px 20px; display: grid; gap: 18px; overflow-y: auto; max-height: calc(100dvh - 170px); }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--separator); }
.dialog-section { display: grid; gap: 12px; }
.dialog-section h3 { margin: 0; font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label-3); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row > span { font-size: 13.5px; color: var(--label-2); }
.small-print { font-size: 12.5px; color: var(--label-3); line-height: 1.55; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 120px; translate: -50% 0; z-index: 50; padding: 9px 14px; border-radius: var(--r-sm); background: var(--label); color: var(--bg); font-weight: 560; font-size: 13px; box-shadow: var(--shadow-3); animation: rise 180ms var(--ease); }

/* ------------------------------------------------------------------ phones: the sidebar becomes a drawer */

.scrim { display: none; }
@media (max-width: 800px) {
  .app, .app.sidebar-hidden { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(300px, 86vw); transform: translateX(-102%); transition: transform 240ms var(--ease); visibility: visible !important; box-shadow: var(--shadow-3); }
  .app.drawer-open .sidebar { transform: none; }
  .app.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 39; background: var(--scrim); }
  .thread { padding: 22px 16px 32px; }
  .dock { padding-left: 12px; padding-right: 12px; }
  .cell-status .status-detail { display: none; }
  .cell { padding: 0 12px; }
  .msg { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .avatar { width: 24px; height: 24px; }
  .start { padding-top: 3vh; }
}

@media (max-width: 800px) { #show-sidebar[hidden] { display: inline-grid !important; } }

@media (hover: none) and (pointer: coarse) {
  .composer textarea { font-size: max(16px, var(--text)); }
  .input, textarea.input { font-size: 16px; }
}

@keyframes breathe { 50% { opacity: 0.35; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise { from { opacity: 0; translate: -50% 6px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="sidebar-head">
      <div class="brand"><span id="brand-mark"></span><span class="brand-name" id="brand-name">Local AI</span><span class="brand-badge" id="brand-badge" hidden></span></div>
      <button class="icon-btn" id="hide-sidebar" title="Hide the sidebar" aria-label="Hide the sidebar"></button>
    </div>
    <div class="side-actions">
      <button class="side-new" id="new-chat"><span data-icon="compose"></span>New chat<kbd>Ctrl+Shift+O</kbd></button>
      <label class="search"><span data-icon="search"></span><input class="input" id="search" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></label>
    </div>
    <nav class="chat-list scroll" id="chat-list"></nav>
    <div class="meters" id="meters" hidden></div>
    <div class="sidebar-foot">
      <div class="segmented" id="theme-switch" role="group" aria-label="Theme">
        <button data-theme-choice="system" title="Match the system" aria-label="Match the system"></button>
        <button data-theme-choice="light" title="Light" aria-label="Light"></button>
        <button data-theme-choice="dark" title="Dark" aria-label="Dark"></button>
      </div>
      <button class="btn btn-ghost" id="open-settings"><span data-icon="sliders"></span>Settings</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="show-sidebar" title="Show chats" aria-label="Show chats"></button>
      </div>
      <div class="chat-heading"><strong id="chat-title">New chat</strong><span class="chat-count" id="chat-count"></span></div>
      <div class="cells">
        <div class="cell cell-status status" id="status" data-tone="off"><span class="status-dot"></span><span class="status-text" id="status-text">Not connected</span><span class="status-detail" id="status-detail"></span></div>
        <div class="cell cell-memory" id="gauge-memory" title="How much of the model's memory the last reply used"><span class="gauge-name">Memory</span><span class="gauge-track"><span class="gauge-fill" id="memory-fill"></span></span><span class="gauge-value" id="memory-value">–</span></div>
        <div class="cell cell-speed" id="gauge-speed" title="Speed of recent replies"><span class="gauge-name">Speed</span><svg class="spark" viewBox="0 0 64 18" aria-hidden="true"><path id="speed-spark" d=""></path></svg><span class="gauge-value" id="speed-value">–</span></div>
      </div>
      <div class="topbar-end"><button class="icon-btn" id="more" title="More" aria-label="More" aria-haspopup="menu"></button></div>
      <div class="menu" id="more-menu" role="menu" hidden>
        <button role="menuitem" id="menu-export"><span data-icon="download"></span>Download this chat</button>
        <button role="menuitem" id="menu-delete"><span data-icon="trash"></span>Delete this chat</button>
        <hr>
        <button role="menuitem" id="menu-connect"><span data-icon="link"></span>Connect to a server</button>
        <button role="menuitem" id="menu-shutdown" class="btn-danger"><span data-icon="power"></span>Shut the server down</button>
      </div>
    </header>

    <div class="scroller scroll" id="scroller"><div class="thread" id="thread"></div></div>

    <div class="dock">
      <div class="dock-inner">
        <div class="banner" id="banner" hidden></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-files" id="composer-files" hidden></div>
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
          <div class="composer-bar">
            <button type="button" class="chip" id="attach"><span data-icon="clip"></span><span id="attach-label">Attach</span></button>
            <button type="button" class="chip on" id="think" hidden aria-haspopup="menu"><span data-icon="spark"></span><span id="think-label">Think</span><span data-icon="chevron-down"></span></button>
            <span class="hint" id="hint">↵ send · ⇧↵ new line</span>
            <button type="submit" class="send" id="send" aria-label="Send" disabled></button>
          </div>
          <div class="effort-menu" id="effort-menu" role="menu" hidden></div>
          <input type="file" id="file-input" multiple hidden>
        </form>
      </div>
    </div>
  </div>
</div>

<dialog id="settings" aria-labelledby="settings-title">
  <div class="dialog-head"><h2 id="settings-title">Settings</h2><button class="icon-btn" data-close aria-label="Close"></button></div>
  <div class="dialog-body scroll">
    <section class="dialog-section">
      <h3>Server</h3>
      <div class="row"><span id="settings-server">Not connected</span><span class="connect-row"><button class="btn" id="settings-connect">Change</button><button class="btn btn-danger" id="settings-forget">Forget</button></span></div>
    </section>
    <section class="dialog-section">
      <h3>The model</h3>
      <label class="field"><span>Instructions for every chat</span><textarea class="input" id="pref-system" placeholder="For example: Answer briefly. Use British spelling."></textarea><small>Sent as the system prompt at the start of each conversation.</small></label>
      <label class="field"><span>Temperature</span><input class="input" id="pref-temperature" type="number" min="0" max="2" step="0.05" placeholder="The model's default"><small>Lower is more predictable, higher more varied. Leave empty for the model's own setting.</small></label>
    </section>
    <section class="dialog-section">
      <h3>This device</h3>
      <div class="row"><span>Text size</span><div class="segmented" id="pref-size"><button data-value="small">Small</button><button data-value="medium">Medium</button><button data-value="large">Large</button></div></div>
      <div class="row"><span>Send with</span><div class="segmented" id="pref-send"><button data-value="enter">Enter</button><button data-value="ctrl">Ctrl+Enter</button></div></div>
    </section>
    <section class="dialog-section">
      <h3>Your chats</h3>
      <p class="small-print">Chats are saved in this browser only. Nothing is kept on the server, which forgets everything when its session ends.</p>
      <div class="connect-row"><button class="btn" id="export-all"><span data-icon="download"></span>Export all</button><button class="btn" id="import-all">Import</button><button class="btn btn-danger" id="delete-all"><span data-icon="trash"></span>Delete all</button><input type="file" id="import-input" accept="application/json,.json" hidden></div>
    </section>
  </div>
</dialog>

<dialog id="connect-dialog" aria-labelledby="connect-title">
  <div class="dialog-head"><h2 id="connect-title">Connect to your server</h2><button class="icon-btn" data-close aria-label="Close"></button></div>
  <div class="dialog-body" id="connect-dialog-body"></div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="dialog-head"><h2 id="confirm-title"></h2></div>
  <div class="dialog-body"><p class="small-print" id="confirm-text" style="font-size:14px;color:var(--label-2)"></p></div>
  <div class="dialog-foot"><button class="btn" id="confirm-no">Cancel</button><button class="btn btn-primary" id="confirm-yes">OK</button></div>
</dialog>

<script type="module">
// ------------------------------------------------------------------ settings you might change

const REPO = "https://github.com/zamsonl/no-gpu-local-ai";
const NOTEBOOK = (name) => `${REPO}/blob/main/notebooks/${name}`;
/** Where to run the server: how to open the notebook on each, and what to do there. */
const HOSTS = {
  kaggle: {
    name: "Kaggle",
    meta: "2 × T4 GPUs · about 80K tokens · 30 GPU hours a week",
    open: `https://www.kaggle.com/kernels/welcome?src=${NOTEBOOK("kaggle.ipynb")}`,
    steps: [
      ["Sign in and verify your phone number", " in Kaggle's settings. Without it, notebooks get no GPU and no internet."],
      ["Open the notebook", " with the button below and let Kaggle import it."],
      ["In the side panel, Settings → Accelerator → GPU T4 x2,", " and turn Internet on."],
      ["Run All.", " After four to six minutes it prints READY and a link."],
    ],
    note: "The recommended one. To keep it running with the tab closed, use Save Version → Save & Run All instead, and take the link from that run's log.",
  },
  colab: {
    name: "Colab",
    meta: "1 × T4 GPU · about 24K tokens",
    open: `https://colab.research.google.com/github/${REPO.replace("https://github.com/", "")}/blob/main/notebooks/colab.ipynb`,
    steps: [

/** el("div", {class: "x", onclick}, child, "text") — attributes, then children (text is never parsed as HTML). */
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child);
  return node;
}

function fmtDuration(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  if (seconds < 60) return `${seconds} s`;
  const m = Math.floor(seconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  return `${h} h ${String(m % 60).padStart(2, "0")} min`;
}

function relativeTime(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return "now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
  return `${Math.floor(diff / 86400)}d`;
}

function dayGroup(ts) {
  const start = new Date(); start.setHours(0, 0, 0, 0);

}

const chatStore = {
  db: null,
  memory: new Map(),
  async open() {
    try {
      this.db = await new Promise((resolve, reject) => {
        const request = indexedDB.open("no-gpu-local-ai", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("chats", { keyPath: "id" });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    } catch { this.db = null; }
  },
  tx(mode, run) {
    return new Promise((resolve, reject) => {
      const t = this.db.transaction("chats", mode);
      const result = run(t.objectStore("chats"));
      t.oncomplete = () => resolve(result.result);
      t.onerror = () => reject(t.error);
    });
  },
  async all() { return this.db ? this.tx("readonly", (s) => s.getAll()) : [...this.memory.values()]; },
  async put(chat) {
    const copy = structuredClone(chat);
    if (this.db) await this.tx("readwrite", (s) => s.put(copy)); else this.memory.set(chat.id, copy);
  },
  async delete(id) { if (this.db) await this.tx("readwrite", (s) => s.delete(id)); else this.memory.delete(id); },
  async clear() { if (this.db) await this.tx("readwrite", (s) => s.clear()); else this.memory.clear(); },
};

// ------------------------------------------------------------------ Markdown, built as DOM (the model's text is never parsed as HTML)

const LIST_RE = /^(\s*)([-*+]|\d{1,9}[.)])(\s+|$)/;
const FENCE_RE = /^\s{0,3}(`{3,}|~{3,})\s*([\w#+.-]*)/;
const TABLE_SEP_RE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const indentOf = (line) => line.match(/^\s*/)[0].replace(/\t/g, "    ").length;
const isBlank = (line) => /^\s*$/.test(line);

function isTableStart(lines, i) {
  return lines[i].includes("|") && i + 1 < lines.length && lines[i + 1].includes("-") && TABLE_SEP_RE.test(lines[i + 1]) && (lines[i + 1].includes("|") || lines[i].trim().startsWith("|"));
}

function startsBlock(lines, i) {
  const line = lines[i];
  return FENCE_RE.test(line) || /^\s{0,3}#{1,6}\s/.test(line) || /^\s{0,3}>/.test(line) || LIST_RE.test(line) ||
    /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line) || isTableStart(lines, i);
}

function renderMarkdown(source, { streaming = false } = {}) {
  const root = document.createDocumentFragment();
  renderBlocks(source.replace(/\r\n?/g, "\n").split("\n"), root, streaming);
  return root;
}

function renderBlocks(lines, parent, streaming) {
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (isBlank(line)) { i++; continue; }
    let m;
    if ((m = line.match(FENCE_RE))) {
      const fence = m[1];
      // As far as the opening fence is indented, so is its code: take that much off each line.
      const indent = new RegExp(`^ {0,${line.match(/^ */)[0].length}}`);
      const body = [];
      i++;
      while (i < lines.length) {
        const close = lines[i].match(/^\s{0,3}(`{3,}|~{3,})\s*$/);
        if (close && close[1][0] === fence[0] && close[1].length >= fence.length) break;
        body.push(lines[i++].replace(indent, ""));
      }
      const closed = i < lines.length;
      if (closed) i++;
      parent.append(codeBlock(body.join("\n"), m[2], streaming && !closed));
      continue;
    }
    if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/))) {
      parent.append(inline(m[2], el("h" + m[1].length)));
      i++;
      continue;
    }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { parent.append(el("hr")); i++; continue; }
    if (/^\s{0,3}>/.test(line)) {
      const inner = [];
      while (i < lines.length && !isBlank(lines[i]) && (/^\s{0,3}>/.test(lines[i]) || !startsBlock(lines, i))) inner.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
      const quote = el("blockquote");
      renderBlocks(inner, quote, streaming);
      parent.append(quote);
      continue;
    }
    if (isTableStart(lines, i)) { i = renderTable(lines, i, parent); continue; }
    if (LIST_RE.test(line)) { i = renderList(lines, i, parent, streaming); continue; }
    const para = [line];
    i++;
    while (i < lines.length && !isBlank(lines[i]) && !startsBlock(lines, i)) para.push(lines[i++]);
    parent.append(inline(para.join("\n"), el("p")));
  }
}

function renderList(lines, i, parent, streaming) {
  const first = lines[i].match(LIST_RE);
  const base = indentOf(first[1]);
  const ordered = /\d/.test(first[2]);
  const list = el(ordered ? "ol" : "ul");
  if (ordered && parseInt(first[2], 10) !== 1) list.start = parseInt(first[2], 10);
  while (i < lines.length) {
    const m = lines[i].match(LIST_RE);
    if (!m || Math.abs(indentOf(m[1]) - base) > 1 || /\d/.test(m[2]) !== ordered) break;
    const contentIndent = m[0].length;
    const body = [lines[i].slice(m[0].length)];
    i++;
    while (i < lines.length) {
      const line = lines[i];
      if (isBlank(line)) {
        let j = i + 1;
        while (j < lines.length && isBlank(lines[j])) j++;
        if (j < lines.length && indentOf(lines[j]) > base && !(LIST_RE.test(lines[j]) && indentOf(lines[j]) <= base + 1)) { body.push(""); i++; continue; }
        break;
      }
      const lm = line.match(LIST_RE);
      if (lm && indentOf(lm[1]) <= base + 1) break;
      if (indentOf(line) > base) {
        const spaced = line.replace(/^[ \t]+/, (ws) => ws.replace(/\t/g, "    "));
        body.push(spaced.slice(Math.min(indentOf(line), contentIndent)));
        i++;
        continue;
      }
      if (!startsBlock(lines, i)) { body.push(line); i++; continue; }
      break;
    }
    const item = el("li");
    const text = body.join("\n");
    const task = text.match(/^\[([ xX])\]\s+/);
    const content = task ? text.slice(task[0].length) : text;
    if (task) item.append(el("input", { type: "checkbox", disabled: true, checked: task[1] !== " ", style: "margin:0 8px 0 0;vertical-align:-1px" }));
    const contentLines = content.split("\n");
    const simple = !/\n\s*\n/.test(content.trim()) && !contentLines.some((_, k) => k > 0 && startsBlock(contentLines, k)) && !FENCE_RE.test(contentLines[0]);
    if (simple) inline(content.trim(), item); else renderBlocks(contentLines, item, streaming);
    list.append(item);
  }
  parent.append(list);
  return i;
}

function splitRow(row) {
  return row.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/).map((cell) => cell.trim().replace(/\\\|/g, "|"));
}

function renderTable(lines, i, parent) {
  const head = splitRow(lines[i]);
  const align = splitRow(lines[i + 1]).map((c) => (c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : null));
  const table = el("table");
  const headRow = el("tr");
  head.forEach((cell, k) => headRow.append(inline(cell, el("th", { style: align[k] ? `text-align:${align[k]}` : null }))));
  table.append(el("thead", null, headRow));
  const tbody = el("tbody");
  i += 2;
  while (i < lines.length && !isBlank(lines[i]) && lines[i].includes("|")) {
    const cells = splitRow(lines[i]);
    const row = el("tr");
    head.forEach((_, k) => row.append(inline(cells[k] ?? "", el("td", { style: align[k] ? `text-align:${align[k]}` : null }))));
    tbody.append(row);
    i++;
  }
  table.append(tbody);
  parent.append(el("div", { class: "table-wrap" }, table));
  return i;
}

// Every repeat is bounded: a model stuck repeating "[", "*" or backticks stays linear, not quadratic.
const INLINE_RE = /(`{1,3})(?!`)([^\n]{1,500}?)(?<!`)\1(?!`)|\[([^\]\n]{1,300})\]\(\s*<?([^)\s>]{1,2000})>?(?:\s+"[^"\n]{0,300}")?\s*\)|(https?:\/\/[^\s<>()]{1,2000}[^\s<>().,;:!?'"*_\]])|\*\*(?!\s)([\s\S]{1,1000}?)\*\*|__([\s\S]{1,1000}?)__|~~([\s\S]{1,1000}?)~~|\*(?!\s)([\s\S]{1,1000}?)\*(?!\*)|(?<![\w])_(?!\s)([\s\S]{1,1000}?)_(?![\w])/g;

function safeHref(url) {
  try {
    const parsed = new URL(url, "https://invalid.example/");
    return ["http:", "https:", "mailto:"].includes(parsed.protocol) && !parsed.host.endsWith("invalid.example") ? parsed.href : null;
  } catch { return null; }
}

function appendText(parent, text) {
  const parts = text.split("\n");
  parts.forEach((part, k) => {
    if (k) parent.append(el("br"));
    if (part) parent.append(part.replace(/\\([\\`*_{}[\]()#+\-.!|~>])/g, "$1"));
  });
}

function inline(text, parent) {
  let last = 0;
  for (const m of text.matchAll(INLINE_RE)) {
    if (m.index > last) appendText(parent, text.slice(last, m.index));
    if (m[1]) parent.append(el("code", { text: m[2].replace(/^ (.*) $/, "$1") }));
    else if (m[3]) {
      const href = safeHref(m[4]);
      parent.append(href ? inline(m[3], el("a", { href, target: "_blank", rel: "noopener noreferrer nofollow" })) : inline(m[3], el("span")));
    } else if (m[5]) parent.append(el("a", { href: m[5], target: "_blank", rel: "noopener noreferrer nofollow", text: m[5] }));
    else if (m[6] ?? m[7]) parent.append(inline(m[6] ?? m[7], el("strong")));
    else if (m[8]) parent.append(inline(m[8], el("del")));
    else if (m[9] ?? m[10]) parent.append(inline(m[9] ?? m[10], el("em")));
    last = m.index + m[0].length;
  }
  if (last < text.length) appendText(parent, text.slice(last));
  return parent;
}

// ------------------------------------------------------------------ code: a small highlighter that knows most languages' shapes

const KEYWORDS = new Set(("abstract and as assert async await break case catch class const continue def default defer del delete do elif else enum except export extends false final finally fn for foreach from func function go goto if impl implements import in instanceof interface is lambda let loop match mod module mut namespace new nil none not null of or package pass private protected pub public raise readonly return select self static struct super switch then this throw throws true try type typeof unless until use using var void when where while with yield None True False fi done esac local echo Self println printf").split(" "));
const HASH_COMMENTS = /^(py|python|sh|bash|shell|zsh|fish|rb|ruby|yaml|yml|toml|ps1|powershell|pwsh|r|perl|pl|make|makefile|dockerfile|conf|ini|cfg|nginx|elixir|ex|nim|julia|jl|cmake|tcl|awk|sed|gitignore|env|properties)$/i;
const DASH_COMMENTS = /^(sql|lua|haskell|hs|elm|ada|vhdl|plsql|psql|mysql|sqlite)$/i;
const MARKUP = /^(html|xml|svg|vue|svelte|xhtml|jsx|tsx)$/i;
const PLAIN = /^(text|txt|plain|plaintext|markdown|md|output|log|console|csv|diff)$/i;

function highlight(code, lang) {
  const frag = document.createDocumentFragment();
  if (!lang || PLAIN.test(lang) || code.length > 60_000) { frag.append(code); return frag; }
  // Block comments only where the language has them; one with no end yet stops at its line's end.
  const comment = [];
  if (!HASH_COMMENTS.test(lang) && !DASH_COMMENTS.test(lang)) comment.push(String.raw`\/\*[\s\S]*?\*\/|\/\*[^\n]*`);
  if (MARKUP.test(lang)) comment.push(String.raw`<!--[\s\S]*?-->|<!--[^\n]*`);
  if (HASH_COMMENTS.test(lang)) comment.push("#[^\\n]*");
  else if (DASH_COMMENTS.test(lang)) comment.push("--[^\\n]*");
  if (!HASH_COMMENTS.test(lang)) comment.push("\\/\\/[^\\n]*");
  const parts = [
    `(${comment.join("|")})`,
    String.raw`("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|` + "`(?:\\\\.|[^`\\\\])*`?)",
    String.raw`(\b(?:0x[\da-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)\b)`,
    MARKUP.test(lang) ? String.raw`(<\/?[A-Za-z][\w:.-]*|\/?>)` : "(\\0)",
    String.raw`([A-Za-z_$][\w$]*)(?=\s*\()`,
    String.raw`([A-Za-z_$][\w$]*)`,
  ];
  const re = new RegExp(parts.join("|"), "g");
  let last = 0;
  const span = (cls, text) => frag.append(el("span", { class: cls, text }));
  for (const m of code.matchAll(re)) {
    if (m.index > last) frag.append(code.slice(last, m.index));
    if (m[1]) span("t-comment", m[1]);
    else if (m[2]) span("t-string", m[2]);
    else if (m[3]) span("t-number", m[3]);
    else if (m[4]) span("t-tag", m[4]);
    else if (m[5]) span(KEYWORDS.has(m[5]) ? "t-keyword" : "t-fn", m[5]);
    else if (m[6]) { if (KEYWORDS.has(m[6])) span("t-keyword", m[6]); else frag.append(m[6]); }
    else frag.append(m[0]);
    last = m.index + m[0].length;
  }
  if (last < code.length) frag.append(code.slice(last));
  return frag;
}

const EXTENSIONS = { python: "py", py: "py", javascript: "js", js: "js", typescript: "ts", ts: "ts", tsx: "tsx", jsx: "jsx", bash: "sh", sh: "sh", shell: "sh", zsh: "sh", powershell: "ps1", ps1: "ps1", html: "html", css: "css", json: "json", yaml: "yml", yml: "yml", toml: "toml", sql: "sql", c: "c", cpp: "cpp", "c++": "cpp", csharp: "cs", cs: "cs", java: "java", go: "go", rust: "rs", rs: "rs", ruby: "rb", php: "php", swift: "swift", kotlin: "kt", lua: "lua", r: "r", markdown: "md", md: "md", xml: "xml", dockerfile: "Dockerfile", makefile: "Makefile" };

function codeBlock(code, lang, open) {
  const lines = code.split("\n");
  const label = lang || "text";
  const ext = EXTENSIONS[label.toLowerCase()];
  const fileName = ext === "Dockerfile" || ext === "Makefile" ? ext : `snippet.${ext || "txt"}`;
  const copy = el("button", { class: "code-action", type: "button", onclick: (e) => copyText(code, e.currentTarget) }, icon("copy", 13), "Copy");
  const save = el("button", { class: "code-action", type: "button", onclick: () => saveFile(fileName, code) }, icon("download", 13), "Download");
  return el("div", { class: "code-block" },
    el("div", { class: "code-head" },
      el("span", { class: "code-lang", text: label }),
      el("span", { class: "code-count", text: `· ${plural(lines.length, "line")}${open ? " …" : ""}` }),
      el("span", { class: "code-actions" }, copy, save)),
    el("div", { class: "code-body scroll" },
      el("div", { class: "code-gutter", "aria-hidden": "true", text: lines.map((_, k) => k + 1).join("\n") }),
      el("pre", null, el("code", null, highlight(code, label)))));
}

/** Some models write their reasoning inside <think> tags instead of a separate field. */
function splitThinking(message) {
  if (message.thinking || !message.content.trimStart().startsWith("<think>")) return { thinking: message.thinking || "", content: message.content };
  const body = message.content.trimStart().slice(7);
  const end = body.indexOf("</think>");
  return end < 0 ? { thinking: body, content: "" } : { thinking: body.slice(0, end), content: body.slice(end + 8).trimStart() };
}

// ------------------------------------------------------------------ the server

const server = {
  url: "",
  key: "",
  info: null, // what /info said last
  state: "none", // none | checking | ready | loading | offline | unauthorized | stopped
  checkedAt: 0,
  timer: null,
};

function loadConnection() {
  const saved = store.get("server", null);
  if (saved?.url && saved?.key) Object.assign(server, { url: saved.url, key: saved.key, state: "checking" });
  const fromLink = parseLink(location.hash);
  if (fromLink) {
    Object.assign(server, fromLink, { state: "checking", info: null });
    store.set("server", fromLink);
    history.replaceState(null, "", location.pathname + location.search); // the key leaves the address bar
  }
}

/** The notebook's link: #server=<url>&key=<key>; also accepts the whole link pasted, or a bare URL. */
function parseLink(text) {
  const hash = String(text || "").includes("#") ? String(text).slice(String(text).indexOf("#") + 1) : "";
  const params = new URLSearchParams(hash);
  const url = normaliseUrl(params.get("server"));
  const key = (params.get("key") || "").trim();
  return url && key ? { url, key } : null;
}

function normaliseUrl(text) {
  let value = String(text || "").trim();
  if (!value) return "";
  if (!/^https?:\/\//i.test(value)) value = "https://" + value;
  try {
    const parsed = new URL(value);
    if (!["http:", "https:"].includes(parsed.protocol)) return "";
    return parsed.origin;
  } catch { return ""; }
}

async function call(path, { method = "GET", body, signal } = {}) {
  return fetch(server.url + path, {
    method,
    signal,
    headers: { authorization: `Bearer ${server.key}`, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
}

async function checkServer({ quiet = false } = {}) {
  if (!server.url) { server.state = "none"; renderStatus(); return; }
  if (!quiet && server.state !== "ready") server.state = "checking";
  renderStatus();
  try {
    const res = await call("/info", { signal: AbortSignal.timeout(15_000) });
    if (res.status === 401) server.state = "unauthorized";
    else if (!res.ok) server.state = "offline";
    else {
      const info = await res.json();
      if (info.app !== "no-gpu-local-ai") server.state = "offline";
      else {
        server.info = info;
        server.state = info.model ? "ready" : "loading";
        server.checkedAt = Date.now();
        store.set("info", info);
      }
    }
  } catch {
    if (server.state !== "stopped") server.state = "offline";
  }
  renderAll();
  scheduleCheck();
}

function scheduleCheck() {
  clearTimeout(server.timer);
  if (!server.url || server.state === "unauthorized") return;
  const wait = server.state === "ready" ? 30_000 : 10_000;
  server.timer = setTimeout(() => { if (!document.hidden) checkServer({ quiet: true }); else scheduleCheck(); }, wait);
}

function connect(url, key) {
  Object.assign(server, { url, key, info: null, state: "checking" });
  store.set("server", { url, key });
  return checkServer();
}

function forgetServer() {
  clearTimeout(server.timer);
  Object.assign(server, { url: "", key: "", info: null, state: "none" });
  store.remove("server");
  store.remove("info");
  renderAll();
}

const ready = () => server.state === "ready" && server.info;
const vision = () => Boolean(server.info?.vision);
const thinks = () => Boolean(server.info?.thinking);

function gpuLabel(info) {
  if (!info?.gpus?.length) return "";
  const names = info.gpus.map((g) => g.replace(/^(NVIDIA|Tesla)\s+/i, "").replace(/^Tesla\s+/i, ""));
  const same = names.every((n) => n === names[0]);
  return same ? `${names.length > 1 ? names.length + "× " : ""}${names[0]}` : names.join(" + ");
}
const platformName = (p) => ({ kaggle: "Kaggle", colab: "Colab" })[p] || "Server";

function modelName() {
  const label = server.info?.label || store.get("info", null)?.label || "";
  return label.replace(/\s*\([^)]*\)\s*$/, "") || "Local AI";
}
function modelBadge() {
  const info = server.info || store.get("info", null);
  const text = `${info?.label || ""} ${info?.source || ""}`;
  return text.match(/\((\w[\w.]*)\)\s*$/)?.[1] || text.match(/\b(\d+(?:\.\d+)?[bB])\b/)?.[1]?.toUpperCase() || "";
}

// ------------------------------------------------------------------ chats

let chats = [];
let currentId = null;
let running = null; // { chat, reply, controller }
let editing = null; // { id, draft, caret } while a message is being edited
let draftFiles = []; // [{ kind: "image"|"text", name, data|text, url }]

const currentChat = () => chats.find((c) => c.id === currentId) || null;

async function saveChat(chat) {
  if (!chats.includes(chat)) return; // deleted while a reply was still streaming into it
  chat.updated = Date.now();
  try { await chatStore.put(chat); } catch (err) { toast("Couldn't save the chat in this browser"); }
}

function newChat() {
  if (running && running.chat.id === currentId && !currentChat()?.messages.length) return;
  currentId = null;
  editing = null;
  closeDrawer();
  renderAll();
  $("input").focus();
}

function openChat(id) {
  currentId = id;
  editing = null;
  closeDrawer();
  renderAll();
  scrollToEnd(true);
}

async function deleteChat(id) {
  const chat = chats.find((c) => c.id === id);
  if (!chat) return;
  if (!(await confirmDialog("Delete this chat?", `"${chat.title || "New chat"}" is removed from this browser for good.`, "Delete"))) return;
  if (running?.chat.id === id) running.controller.abort();
  chats = chats.filter((c) => c.id !== id);
  await chatStore.delete(id);
  if (currentId === id) currentId = null;
  renderAll();
}

/** An imported chat rebuilt field by field in this app's own shape; null when it isn't a chat. */
function normaliseChat(raw) {
  if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || !/^[\w-]{1,64}$/.test(raw.id) || !Array.isArray(raw.messages)) return null;
  const str = (v) => (typeof v === "string" ? v : "");
  const num = (v, fallback) => (Number.isFinite(v) ? v : fallback);
  const messages = raw.messages
    .filter((m) => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string")
    .map((m) => {
      const images = Array.isArray(m.images) ? m.images.filter((i) => i && typeof i.data === "string" && /^[A-Za-z0-9+/=]+$/.test(i.data)).map((i) => ({ name: str(i.name) || "picture", data: i.data })) : [];
      const files = Array.isArray(m.files) ? m.files.filter((f) => f && typeof f.text === "string").map((f) => ({ name: str(f.name) || "file", text: f.text })) : [];
      const stats = m.stats && typeof m.stats === "object" ? Object.fromEntries(Object.entries(m.stats).filter(([, v]) => Number.isFinite(v))) : null;
      return {
        id: typeof m.id === "string" ? m.id : uid(),
        role: m.role,
        content: m.content,
        ...(m.role === "assistant" ? { thinking: str(m.thinking) } : {}),
        at: num(m.at, Date.now()),
        ...(images.length ? { images } : {}),
        ...(files.length ? { files } : {}),
        ...(stats ? { stats } : {}),
        ...(m.stopped === true ? { stopped: true } : {}),
        ...(typeof m.error === "string" ? { error: m.error } : {}),
        ...(typeof m.effort === "string" && EFFORTS[m.effort] ? { effort: m.effort } : {}),
      };
    });
  const created = num(raw.created, Date.now());
  return { id: raw.id, title: str(raw.title).slice(0, 200), created, updated: num(raw.updated, created), messages };
}

function titleFrom(text) {
  const line = text.trim().split("\n").find((l) => l.trim()) || "Pictures";
  return line.length > 60 ? line.slice(0, 57).trimEnd() + "…" : line;
}

// ------------------------------------------------------------------ talking to the model

const EFFORTS = {
  off: { label: "Off", note: "Answers straight away", value: false },
  quick: { label: "Quick", note: "Thinks briefly first", value: "low" },
  balanced: { label: "Balanced", note: "Thinks it through", value: "medium" },
  deep: { label: "Deep", note: "Takes its time; best for hard problems", value: true },
};

function messageText(message) {
  const files = (message.files || []).map((f) => `File: ${f.name}\n\`\`\`\n${f.text}\n\`\`\``).join("\n\n");
  return files ? `${files}\n\n${message.content}` : message.content;
}

/** The newest messages that fit the model's memory, leaving room for the reply. */
function buildContext(history) {
  const ctx = server.info?.num_ctx || 8192;
  const reserve = Math.min(8192, Math.floor(ctx / 4));
  let budget = (ctx - reserve) * CHARS_PER_TOKEN;
  const system = prefs.system.trim();
  if (system) budget -= system.length;
  const out = [];
  const usable = history.filter((m) => m.role === "user" || splitThinking(m).content.trim());
  for (let k = usable.length - 1; k >= 0; k--) {
    const m = usable[k];
    const content = m.role === "assistant" ? splitThinking(m).content : messageText(m);
    const images = vision() ? (m.images || []).map((img) => img.data) : [];
    const cost = content.length + images.length * IMAGE_TOKENS * CHARS_PER_TOKEN;
    if (cost > budget && out.length) break;
    budget -= cost;
    out.unshift(images.length ? { role: m.role, content, images } : { role: m.role, content });
  }
  if (system) out.unshift({ role: "system", content: system });
  return { messages: out, dropped: usable.length - out.length + (system ? 1 : 0) };
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if ((!text && !draftFiles.length) || running) return;
  if (!ready()) { showConnectionBanner(true); return; }
  let chat = currentChat();
  if (!chat) {
    chat = { id: uid(), title: "", created: Date.now(), updated: Date.now(), messages: [] };
    chats.unshift(chat);
    currentId = chat.id;
  }
  const images = draftFiles.filter((f) => f.kind === "image").map(({ name, data }) => ({ name, data }));
  const files = draftFiles.filter((f) => f.kind === "text").map(({ name, text: body }) => ({ name, text: body }));
  chat.messages.push({ id: uid(), role: "user", content: text, ...(images.length ? { images } : {}), ...(files.length ? { files } : {}), at: Date.now() });
  if (!chat.title) chat.title = titleFrom(text || files[0]?.name || "");
  input.value = "";
  draftFiles = [];
  autosize();
  await reply(chat);
}

async function reply(chat) {
  const answer = { id: uid(), role: "assistant", content: "", thinking: "", at: Date.now(), effort: thinks() ? prefs.effort : null };
  chat.messages.push(answer);
  await saveChat(chat);
  const controller = new AbortController();
  running = { chat, reply: answer, controller };
  renderAll();
  scrollToEnd(true);

  const history = chat.messages.slice(0, -1);
  const { messages, dropped } = buildContext(history);
  const options = {};
  if (prefs.temperature !== "" && !Number.isNaN(Number(prefs.temperature))) options.temperature = Number(prefs.temperature);
  let think = thinks() ? EFFORTS[prefs.effort].value : undefined;
  const started = performance.now();
  let firstAt = 0, thinkStart = 0, answerAt = 0, chunks = 0, thinkChunks = 0, final = null;
  let lastSave = Date.now();

  const handle = (part) => {
    if (part.error) throw new Error(part.error);
    const m = part.message || {};
    const now = performance.now();
    if (m.thinking) {
      if (!firstAt) firstAt = now;
      if (!thinkStart) thinkStart = running.thinkStart = now;
      answer.thinking += m.thinking;
      thinkChunks++;
    }
    if (m.content) {
      if (!firstAt) firstAt = now;
      if (!answerAt) answerAt = now;
      answer.content += m.content;
      chunks++;
    }
    if (part.done) final = part;
    if (Date.now() - lastSave > 3000) { lastSave = Date.now(); saveChat(chat); }
    scheduleLive();
  };

  try {
    const body = () => ({ model: server.info.model, messages, stream: true, ...(think !== undefined ? { think } : {}), ...(Object.keys(options).length ? { options } : {}) });
    let res = await call("/api/chat", { method: "POST", body: body(), signal: controller.signal });
    if (res.status === 400 && think !== undefined) {
      const detail = await res.text();
      if (!/think/i.test(detail)) throw new Error(errorText(detail));
      think = typeof think === "string" ? true : undefined; // this model takes thinking on or off, not levels
      if (/not support/i.test(detail)) { think = undefined; if (server.info) server.info.thinking = false; }
      res = await call("/api/chat", { method: "POST", body: body(), signal: controller.signal });
    }
    if (res.status === 401) { server.state = "unauthorized"; throw new Error("The server didn't accept the key."); }
    if (!res.ok) throw new Error(errorText(await res.text(), res.status));
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (line) handle(JSON.parse(line));
      }
    }
    if (buffer.trim()) handle(JSON.parse(buffer));
    if (!final) throw new Error("The reply was cut off: the server's session may have ended.");
  } catch (err) {
    if (controller.signal.aborted) answer.stopped = true;
    else {
      answer.error = err instanceof TypeError ? "Couldn't reach the server. Its session may have ended." : String(err.message || err);
      if (err instanceof TypeError) server.state = "offline";
    }
  } finally {
    const end = performance.now();
    const tokens = final?.eval_count ?? chunks + thinkChunks;
    const genSeconds = final?.eval_duration ? final.eval_duration / 1e9 : (end - (firstAt || end)) / 1000;
    answer.stats = {
      tokens,
      tps: genSeconds > 0.2 ? tokens / genSeconds : null,
      prompt_tokens: final?.prompt_eval_count ?? null,
      first_token_ms: firstAt ? Math.round(firstAt - started) : null,
      thinking_ms: thinkStart ? Math.round((answerAt || end) - thinkStart) : null,
      thinking_tokens: thinkChunks || null,
      num_ctx: server.info?.num_ctx ?? null,
      dropped: dropped > 0 ? dropped : 0,
    };
    if (!answer.content && !answer.thinking && !answer.error && !answer.stopped) answer.error = "The model sent an empty reply.";
    running = null;
    await saveChat(chat);
    renderAll();
    if (chat.id === currentId) scrollToEnd(false);
    checkServer({ quiet: true });
  }
}

function errorText(raw, status) {
  let message = raw;
  try { message = JSON.parse(raw).error || raw; } catch {}
  message = String(message || "").trim().slice(0, 300);
  if (status === 502 || status === 530 || /cloudflare/i.test(message)) return "Couldn't reach the server. Its session may have ended.";
  return message || `The server answered ${status}.`;
}

function stop() { running?.controller.abort(); }

async function regenerate(chat) {
  if (running) return;
  // Nothing changes until there's a server to answer: an offline click must not lose the reply.
  if (!ready()) { showConnectionBanner(true); return; }
  const last = chat.messages[chat.messages.length - 1];
  if (last?.role === "assistant") chat.messages.pop();
  await reply(chat);
}

async function saveEdit(chat, message, text) {
  if (running) return;
  // Offline, the edit stays open and the later messages stay: nothing is lost for a reply that can't come.
  if (!ready()) { showConnectionBanner(true); return; }
  const index = chat.messages.indexOf(message);
  message.content = text;
  chat.messages.splice(index + 1);
  editing = null;
  await reply(chat);
}

// ------------------------------------------------------------------ rendering: sidebar

function renderSidebar() {
  $("brand-name").textContent = modelName();
  const badge = modelBadge();
  $("brand-badge").textContent = badge;
  $("brand-badge").hidden = !badge;
  const query = $("search").value.trim().toLowerCase();
  const list = $("chat-list");
  const shown = chats
    .filter((c) => !query || (c.title || "").toLowerCase().includes(query) || c.messages.some((m) => m.content.toLowerCase().includes(query)))
    .sort((a, b) => b.updated - a.updated);
  list.replaceChildren();
  if (!shown.length) {
    list.append(el("div", { class: "list-empty", text: query ? "No chats match." : "No chats yet. They're saved in this browser as you go." }));
  }
  let group = "";
  for (const chat of shown) {
    const g = dayGroup(chat.updated);
    if (g !== group) { group = g; list.append(el("div", { class: "chat-group", text: g })); }
    const item = el("div", { class: "chat-item" + (running?.chat.id === chat.id ? " live" : ""), "aria-current": chat.id === currentId ? "true" : "false" },
      el("span", { class: "chat-dot" }),
      el("button", { class: "chat-title", style: "text-align:left;height:100%", text: chat.title || "New chat", onclick: () => openChat(chat.id) }),
      el("span", { class: "chat-time", text: relativeTime(chat.updated) }),
      el("button", { class: "chat-del", title: "Delete", "aria-label": `Delete ${chat.title || "chat"}`, onclick: () => deleteChat(chat.id) }, icon("trash", 14)));
    list.append(item);
  }
  renderMeters();
}

function renderMeters() {
  const meters = $("meters");
  const info = server.info;
  if (!ready() || info.ends_in_s == null) { meters.hidden = true; return; }
  meters.hidden = false;
  const left = Math.max(0, info.ends_in_s - (Date.now() - server.checkedAt) / 1000);
  const idleLimited = info.idle_minutes && !info.busy && left <= info.idle_minutes * 60 + 5;
  const whole = idleLimited ? info.idle_minutes * 60 : 12 * 3600;
  const fill = Math.max(0, Math.min(1, left / whole));
  meters.replaceChildren(
    el("div", null,
      el("div", { class: "meter-row" }, el("span", { text: idleLimited ? "Idle shutdown in" : "Session left" }), el("span", { class: "meter-value", text: fmtDuration(left) })),
      el("div", { class: "meter-track" }, el("div", { class: "meter-fill" + (fill < 0.2 ? " low" : ""), style: `width:${(fill * 100).toFixed(1)}%` })),
      el("div", { class: "meter-note", text: idleLimited ? "Starts over with each message." : `${platformName(info.platform)} ends sessions at 12 hours.` })),
  );
}

// ------------------------------------------------------------------ rendering: the strip

function renderStatus() {
  const status = $("status");
  const states = {
    none: ["off", "Not connected", ""],
    checking: ["busy", "Connecting", ""],
    loading: ["busy", "Loading the model", ""],
    ready: ["ok", "Ready", `${platformName(server.info?.platform)} ${gpuLabel(server.info)}`.trim()],
    offline: ["err", "Offline", ""],
    unauthorized: ["err", "Wrong key", ""],
    stopped: ["off", "Shut down", ""],
  };
  let [tone, text, detail] = states[server.state] || states.none;
  if (running && server.state === "ready") [tone, text] = ["busy", running.reply.content ? "Answering" : running.reply.thinking ? "Thinking" : "Reading"];
  status.dataset.tone = tone;
  $("status-text").textContent = text;
  $("status-detail").textContent = detail;
  document.title = server.info?.label ? `${modelName()}` : "Local AI";
  renderGauges();
}

function renderGauges() {
  const chat = currentChat();
  const replies = (chat?.messages || []).filter((m) => m.role === "assistant" && m.stats);
  const last = replies[replies.length - 1];
  const ctx = server.info?.num_ctx || last?.stats?.num_ctx;
  const used = last?.stats?.prompt_tokens != null ? last.stats.prompt_tokens + (last.stats.tokens || 0) : null;
  if (ctx && used != null) {
    const share = Math.min(1, used / ctx);
    $("memory-fill").style.width = `${(share * 100).toFixed(1)}%`;
    $("memory-fill").classList.toggle("high", share > 0.8);
    $("memory-value").textContent = `${fmtTokens(used)} / ${fmtTokens(ctx)}`;
  } else {
    $("memory-fill").style.width = "0";
    $("memory-value").textContent = ctx ? `– / ${fmtTokens(ctx)}` : "–";
  }
  const speeds = chats.flatMap((c) => c.messages).filter((m) => m.role === "assistant" && m.stats?.tps).sort((a, b) => a.at - b.at).slice(-12).map((m) => m.stats.tps);
  const lastSpeed = last?.stats?.tps ?? speeds[speeds.length - 1];
  $("speed-value").textContent = lastSpeed ? `${lastSpeed.toFixed(1)} tok/s` : "–";
  if (speeds.length > 1) {
    const max = Math.max(...speeds) * 1.1, min = Math.min(...speeds) * 0.9;
    const pts = speeds.map((s, k) => `${((k / (speeds.length - 1)) * 62 + 1).toFixed(1)},${(17 - ((s - min) / (max - min || 1)) * 16).toFixed(1)}`);
    $("speed-spark").setAttribute("d", "M" + pts.join(" L"));
  } else $("speed-spark").setAttribute("d", "M1,9 L63,9");
}

// ------------------------------------------------------------------ rendering: the conversation

let liveFrame = 0;
let liveLast = 0;
function scheduleLive() {
  if (liveFrame) return;
  liveFrame = requestAnimationFrame(() => {
    liveFrame = 0;
    if (performance.now() - liveLast < 45) { scheduleLive(); return; }
    liveLast = performance.now();
    if (!running) return;
    if (running.chat.id === currentId) {
      const node = document.querySelector(`[data-message="${running.reply.id}"]`);
      const stick = nearBottom();
      if (node) node.replaceWith(renderMessage(running.chat, running.reply));
      if (stick) scrollToEnd(false);
    }
    renderStatus();
  });
}

function renderThread() {
  const thread = $("thread");
  const chat = currentChat();
  $("chat-title").textContent = chat?.title || "New chat";

  if (!force && !(showFor[server.state] && (chat?.messages.length || force))) { banner.hidden = true; return; }
  const content = {
